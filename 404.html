<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<style>
@font-face{font-family:'Poppins';src:url('/fonts/poppins-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Poppins';src:url('/fonts/poppins-700.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;text-align:center;
  font-family:'Poppins',system-ui,-apple-system,sans-serif;color:#CFDAEA;line-height:1.65;
  background:radial-gradient(900px 460px at 74% -10%,rgba(78,189,206,.3),transparent 62%),
             linear-gradient(168deg,#102A5C 0%,#0A1E42 54%,#07162F 100%)}
img{width:112px;height:112px;margin-bottom:28px}
h1{color:#fff;font-size:clamp(1.7rem,1.2rem + 2vw,2.4rem);margin:0 0 .5rem;letter-spacing:-.02em}
p{max-width:44ch;margin:0 auto 2rem}
.code{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#4EBDCE;margin-bottom:1rem}
.actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
a.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;
  padding:.95rem 1.6rem;border-radius:999px;text-decoration:none;border:2px solid transparent;
  transition:transform .18s ease,background-color .18s ease}
a.btn:hover{transform:translateY(-2px)}
.p{background:#4EBDCE;color:#07162F}
.p:hover{background:#6FCEDD}
.g{color:#fff;border-color:rgba(255,255,255,.55)}
.g:hover{background:rgba(255,255,255,.12)}
@media (prefers-reduced-motion:reduce){a.btn:hover{transform:none}}
</style>
</head>
<body>
  <main>
    <img src="/img/logo.webp" width="112" height="112" alt="Logo de ISANAT Escuela de Natación">
    <span class="code">Error 404</span>
    <h1>Esta página se fue a nadar</h1>
    <p>No encontramos lo que buscabas. Vuelve al inicio o escríbenos por WhatsApp
       y te ayudamos a encontrar lo que necesitas.</p>
    <div class="actions">
      <a class="btn p" href="/">Volver al inicio</a>
      <a class="btn g" href="https://wa.me/51992705564?text=Hola%2C%20necesito%20ayuda%20con%20la%20web%20de%20ISANAT."
         target="_blank" rel="noopener">Escribir por WhatsApp</a>
    </div>
  </main>
